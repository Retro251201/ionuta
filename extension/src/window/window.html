<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Desktop Companion</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, sans-serif; }
    body { background: radial-gradient(120% 80% at 50% 25%, #3a3550 0%, #1b1a2b 60%, #0f0f1a 100%); }
    #view { position: absolute; inset: 0; }
    .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.25)); pointer-events: none; }
    .hint { position: absolute; left: 10px; right: 10px; top: 8px; text-align: center; color: #b9b0cf; font-size: 11px; transition: opacity 1s; pointer-events: none; z-index: 3; text-shadow: 0 1px 3px #0008; }
    .clock { position: absolute; right: 14px; top: 10px; font-weight: 700; color: #e8def7; font-size: 18px; font-variant-numeric: tabular-nums; z-index: 3; text-shadow: 0 1px 4px #0009; }
    .bubble { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); max-width: 70%; padding: 8px 13px; background: #fff; color: #2b2b3a; border: 2px solid #ffb3d4; border-radius: 15px; font-size: 13px; line-height: 1.35; box-shadow: 0 6px 18px #0004; opacity: 0; transition: opacity .25s, transform .25s; z-index: 4; pointer-events: none; }
    .bubble.show { opacity: 1; }
    .svg-host { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center; }
    .svg-host svg { width: 100%; height: 92%; }
    body[data-mode="svg"] .svg-host { display: flex; }
  </style>
</head>
<body data-mode="loading">
  <div id="view"></div>
  <div class="svg-host" id="svgHost"></div>
  <div class="floor"></div>
  <div class="hint" id="hint">Trascina per ruotare • clic per una reazione • tasto destro per il menu</div>
  <div class="clock" id="clock"></div>
  <div class="bubble" id="bubble"></div>
  <script src="../shared/heads.generated.js"></script>
  <script src="../shared/skins.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../engine/body.js"></script>
  <script type="module" src="window.js"></script>
</body>
</html>
